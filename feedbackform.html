<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FeedBack Form</title>
</head>
<body>
    <form></form>
        <ul>
            <li>Name:<input type="text" placeholder="Enter your name" required/></li>
            <br><li>E-mail:<input type="email" placeholder="Enter your email" required/></li>
            <br><li>Password:<input type="password" minlength="8" maxlength="16"/></li>
            
            <br><li>Click all the Emotion that applies to you</li>
            <blockquote><li>Angry<input type="checkbox"/></li>
                <li>Sad<input type="checkbox"/></li>
                <li>Happy<input type="checkbox"/></li>
                <li>fear<input type="checkbox"/></li>
            </blockquote>
            <br><li>How satisfied you are?</li>
                <li>Very Satisfied<input type="radio" name="satisfaction" value="Very Satisfied"/></li>
                <li>Satisfied<input type="radio" name="satisfaction" value="Satisfied"/></li>
                <li>Didn't Care<input type="radio" name="satisfaction" value="Didn't Care"/></li>
                <li>Disatisfied<input type="radio" name="satisfaction" value="Disatisfied"/></li>
                <li>Very Disatisfied<input type="radio" name="satisfaction" value="Very Disatisfied"/></li>
            </blockquote>
        </ul>
    </form>
</body>
</html>
